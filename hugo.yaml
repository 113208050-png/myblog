# 正式網址（Cloudflare Workers）；之後換自訂網域時改這裡
baseURL: "https://bluewind-blog.bluewindblog.workers.dev/"
locale: zh-tw
defaultContentLanguage: zh-tw
title: 我的部落格
theme: PaperMod

enableRobotsTXT: true
enableGitInfo: true            # 從 Git 紀錄自動取得文章的最後修改日期
frontmatter:
  lastmod: [lastmod, ":git", date]   # 文章裡手動寫 lastmod 時優先使用
ignoreFiles: ['README\.md$']   # 資料夾裡的說明檔不發佈
hasCJKLanguage: true
pagination:
  pagerSize: 10

params:
  env: production
  description: "我的個人部落格：學習筆記、生活紀錄與專案分享。"
  author: 你的名字
  images: []            # 預設分享縮圖，例如 ["images/og.png"]
  defaultTheme: auto
  DateFormat: "2006-01-02"   # 日期顯示格式，例如 2026-10-21
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  homeInfoParams:
    Title: "嗨，歡迎來到我的部落格 👋"
    Content: "這裡記錄我的學習與生活。"
  socialIcons:
    - name: instagram
      url: https://www.instagram.com/bluewind0812/

menu:
  main:
    - name: 文章
      url: /posts/
      weight: 10
    - name: 關於我
      url: /about/
      weight: 20
    - name: 分類標籤
      url: /tags/
      weight: 30
    - name: 搜尋
      url: /search/
      weight: 40

mediaTypes:
  text/markdown:
    suffixes: [md]
  text/cf-headers:        # Cloudflare 的 _headers 檔（沒有副檔名）
    delimiter: ""

outputFormats:
  headers:
    mediaType: text/cf-headers
    baseName: _headers
    isPlainText: true
    notAlternative: true
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  markdown:
    mediaType: text/markdown
    baseName: index
    isPlainText: true

outputs:
  home: [HTML, RSS, JSON, llms, headers]
  page: [HTML, markdown]
